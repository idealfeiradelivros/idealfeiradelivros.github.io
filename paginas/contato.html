<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato - IDEAL Feira de Livros</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;
      padding: 16px 24px;
      overflow-y: auto;
      height: 100%;
      transition: background 0.4s;
    }
    body.dark-mode { background: #1e1e1e; }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: #0b3c5d;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      transition: color 0.4s;
    }
    body.dark-mode .section-title { color: #f0f0f0; }
    .section-title span { color: #d4af37; }

    p {
      font-size: 13px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 10px;
      transition: color 0.4s;
    }
    body.dark-mode p { color: #b0b0b0; }

    /* ===== FORMULÁRIO EM 2 LINHAS ===== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .form-group.full-width { grid-column: 1 / -1; }
    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: #0b3c5d;
      transition: color 0.4s;
    }
    body.dark-mode .form-group label { color: #e0e0e0; }
    .form-group label .required { color: #e53e3e; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 6px 10px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'Montserrat', sans-serif;
      transition: border-color 0.3s;
      background: #fff;
    }
    body.dark-mode .form-group input,
    body.dark-mode .form-group textarea,
    body.dark-mode .form-group select {
      background: #2a2a2a;
      border-color: #444;
      color: #f0f0f0;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #d4af37;
      outline: none;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 50px;
    }
    .btn-submit {
      background: #0b3c5d;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      width: 100%;
    }
    .btn-submit:hover { background: #d4af37; transform: scale(1.02); }

    /* ===== QR CODES GRANDES ===== */
    .qr-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 12px;
    }

    .qr-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: background 0.4s, border-color 0.4s;
    }
    body.dark-mode .qr-card {
      background: #2a2a2a;
      border-color: #444;
    }

    .qr-card .info {
      flex: 1;
      min-width: 0;
    }
    .qr-card .info .icon-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .qr-card .info .icon-wrap svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .qr-card .info .icon-wrap .icon-whatsapp { fill: #25D366; }
    .qr-card .info .icon-wrap .icon-instagram { fill: #E4405F; }
    body.dark-mode .qr-card .info .icon-wrap .icon-whatsapp { fill: #25D366; }
    body.dark-mode .qr-card .info .icon-wrap .icon-instagram { fill: #E4405F; }

    .qr-card .info h4 {
      font-size: 15px;
      font-weight: 700;
      color: #0b3c5d;
      transition: color 0.4s;
    }
    body.dark-mode .qr-card .info h4 { color: #f0f0f0; }
    .qr-card .info p {
      font-size: 13px;
      margin-bottom: 0;
      line-height: 1.4;
    }
    body.dark-mode .qr-card .info p { color: #b0b0b0; }
    .qr-card .info a {
      color: #0b3c5d;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    body.dark-mode .qr-card .info a { color: #d4af37; }
    .qr-card .info a:hover { color: #d4af37; }
    .qr-card .info .small {
      font-size: 11px;
      color: #a0aec0;
    }

    /* QR Code grande */
    .qr-card .qr-code {
      width: 130px;
      height: 130px;
      min-width: 130px;
      min-height: 130px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border: 2px solid #e2e8f0;
      transition: border-color 0.4s;
    }
    body.dark-mode .qr-card .qr-code {
      background: #ffffff;
      border-color: #555;
    }
    .qr-card .qr-code img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 900px) {
      .qr-card .qr-code {
        width: 110px;
        height: 110px;
        min-width: 110px;
        min-height: 110px;
      }
    }

    @media (max-width: 768px) {
      body { padding: 10px 14px; }
      .form-grid { grid-template-columns: 1fr; gap: 8px; }
      .form-group.full-width { grid-column: 1; }
      .qr-container { grid-template-columns: 1fr; gap: 12px; }
      .section-title { font-size: 16px; }
      p { font-size: 12px; }
      .qr-card { padding: 12px 14px; gap: 14px; }
      .qr-card .qr-code {
        width: 100px;
        height: 100px;
        min-width: 100px;
        min-height: 100px;
      }
      .qr-card .info .icon-wrap svg {
        width: 24px;
        height: 24px;
      }
    }

    @media (max-width: 480px) {
      .section-title { font-size: 14px; }
      p { font-size: 11px; }
      .btn-submit { font-size: 11px; padding: 6px 12px; }
      .qr-card { flex-wrap: wrap; justify-content: center; text-align: center; }
      .qr-card .info .icon-wrap { justify-content: center; }
      .qr-card .qr-code {
        width: 140px;
        height: 140px;
        min-width: 140px;
        min-height: 140px;
      }
      .form-group input,
      .form-group textarea,
      .form-group select { font-size: 11px; padding: 5px 8px; }
      .form-group label { font-size: 10px; }
    }
  </style>
</head>
<body>

  <h2 class="section-title">📝 <span>Solicite</span> uma proposta personalizada</h2>

  <p>
    Preencha o formulário abaixo e entraremos em contato para agendar uma apresentação gratuita na sua escola.
  </p>

  <!-- FORMULÁRIO EM 2 LINHAS -->
<form id="contactForm" action="https://formsubmit.co/idealfeiradelivros@gmail.com" method="POST">
  <div class="form-grid">
    <div class="form-group">
      <label for="nome">Nome completo <span class="required">*</span></label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
    </div>
    <div class="form-group">
      <label for="cargo">Cargo na escola <span class="required">*</span></label>
      <input type="text" id="cargo" name="cargo" placeholder="Ex: Coordenadora" required />
    </div>
    <div class="form-group">
      <label for="escola">Nome da escola <span class="required">*</span></label>
      <input type="text" id="escola" name="escola" placeholder="Digite o nome da escola" required />
    </div>
    <div class="form-group">
      <label for="telefone">Telefone/WhatsApp <span class="required">*</span></label>
      <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required />
    </div>
    <div class="form-group full-width">
      <label for="email">E-mail <span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required />
    </div>
    <div class="form-group full-width">
      <label for="mensagem">Mensagem / Observações</label>
      <textarea id="mensagem" name="mensagem" placeholder="Conte-nos sobre sua escola..."></textarea>
    </div>
    
    <!-- 🔽 CAMPOS OCULTOS DO FORMSUBMIT (adicione aqui) 🔽 -->
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://idealfeiradelivros.github.io/paginas/obrigado.html">
    
    <div class="form-group full-width">
      <button type="submit" class="btn-submit">📩 Enviar solicitação</button>
    </div>
  </div>
</form>
