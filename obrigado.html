<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem enviada - Ideal Feira de Livros</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      max-width: 520px;
      padding: 50px 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      border-top: 6px solid #d4af37;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      color: #0b3c5d;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      color: #4a5568;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .highlight {
      color: #0b3c5d;
      font-weight: 600;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: #0b3c5d;
      color: #ffffff;
      padding: 12px 36px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: background 0.3s, transform 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #d4af37;
      transform: scale(1.02);
    }
    .emoji {
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1>Mensagem enviada!</h1>
    <p>Sua solicitação foi recebida com sucesso.</p>
    <p style="font-size: 15px; color: #718096;">
      <span class="emoji">📚</span> Em breve nossa equipe entrará em contato.
    </p>
    <p style="font-size: 13px; color: #a0aec0; margin-top: 16px;">
      Ideal Feira de Livros • Desde 1997
    </p>
    <a href="index.html" class="btn">Voltar ao site</a>
  </div>
</body>
</html>
